# Build a signed Android App Bundle with Godot and upload it to Google Play.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
# Version: version_code = inputs.version_code or github.run_number + 100,
#          version_name = inputs.version_name or VERSION from game/src/core/version.gd.
# NOTE: github.run_number is per workflow file. If both this workflow (push to main) and
# release.yml (which passes its own version_code) upload to the same Play app, make sure
# the codes never go backwards (Play rejects non-increasing codes).
name: build-android

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: string
        default: internal
      version_code:
        description: Override version code (default run_number + 100)
        type: string
        default: ""
      version_name:
        description: Override version name (default from version.gd)
        type: string
        default: ""
  workflow_call:
    inputs:
      track:
        description: Play track
        type: string
        default: internal
      version_code:
        description: Override version code (default run_number + 100)
        type: string
        default: ""
      version_name:
        description: Override version name (default from version.gd)
        type: string
        default: ""

permissions:
  contents: read

env:
  ANDROID_SDK_PACKAGES: >-
    platform-tools
    build-tools;36.1.0
    platforms;android-36
    cmake;3.10.2.4988404
    ndk;29.0.14206865

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - name: Mask secrets and check they exist
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            value="${!name}"
            if [ -z "$value" ]; then missing="$missing $name"; else echo "::add-mask::$value"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot
          key: godot-${{ runner.os }}-${{ hashFiles('Makefile', 'tools/setup_env.sh') }}

      - name: Setup Godot
        run: make setup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs cmdline-tools, sets ANDROID_HOME, accepts licenses. Packages are installed below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      # Godot 4.7.2 (platform/android/java/app/config.gradle, detect.py): compileSdk/targetSdk 36,
      # Build-Tools 36.1.0, NDK 29.0.14206865, CMake 3.10.2.4988404, JDK 17.
      - name: Install Android SDK packages
        run: |
          # shellcheck disable=SC2086
          sdkmanager --install $ANDROID_SDK_PACKAGES >/dev/null

      # Godot reads the SDK/JDK location from its editor settings, not from env.
      - name: Write Godot editor settings
        run: |
          dir="$HOME/.config/godot"
          mkdir -p "$dir"
          cat > "$dir/editor_settings-4.7.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          TRES

      - name: Decode keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Resolve version
        id: version
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          code="${INPUT_CODE:-$((GITHUB_RUN_NUMBER + 100))}"
          name="$INPUT_NAME"
          if [ -z "$name" ]; then
            name="$(sed -nE 's/^const VERSION: String = "([^"]+)".*/\1/p' game/src/core/version.gd | head -n1)"
          fi
          [ -n "$name" ] || { echo "::error::Cannot determine version name"; exit 1; }
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name ($code)"

      # Release flow: changelog produced by release.yml (artifact "changelog"), keyed by version code.
      - name: Download changelog
        if: inputs.version_code != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: fastlane/metadata/android/en-US/changelogs

      - name: Inject secrets and version
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          bash tools/inject_secrets.sh android
          bash tools/set_version.sh "$VERSION_NAME" "$VERSION_CODE"

      - name: Export AAB
        run: |
          mkdir -p export/android
          .tools/godot --headless --path game --export-release "Android" ../export/android/game.aab
          # Godot can exit 0 on a failed export; verify the artifact.
          test -s export/android/game.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: export/android/game.aab
          retention-days: 30

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Google Play
        env:
          TRACK: ${{ inputs.track || 'internal' }}
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          chmod 600 "$RUNNER_TEMP/play.json"
          export GOOGLE_PLAY_JSON_KEY_PATH="$RUNNER_TEMP/play.json"
          if [ "$TRACK" = "internal" ]; then
            bundle exec fastlane android internal
          else
            bundle exec fastlane android upload track:"$TRACK"
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play.json"
