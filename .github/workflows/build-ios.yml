# Build the iOS project with Godot, sign with fastlane match and upload to TestFlight.
#
# COST: macOS runners bill at 10x the Linux rate on private repos (about 0.08 USD/min for
# macos-15; a build takes ~15-20 min, so ~1.5 USD per run). Free for public repos.
# Mitigation: this workflow skips doc-only pushes, and release.yml builds iOS only on tags.
# ALTERNATIVE: a self-hosted Mac (e.g. a Mac mini). Set the repository variable
#   IOS_RUNNER = ["self-hosted","macOS"]
# (Settings -> Secrets and variables -> Actions -> Variables) and the job below switches
# from `macos-15` to that runner without editing this file. The Mac needs Xcode, Ruby 3.3
# (or rbenv) and network access to GitHub; runner-hosted tools persist, so .tools stays warm.
#
# Required secrets:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_KEY_CONTENT (full .p8 text), MATCH_GIT_URL, MATCH_PASSWORD,
#   MATCH_GIT_BASIC_AUTHORIZATION (base64 of "user:personal_access_token")
name: build-ios

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Override build number (default run_number + 100)
        type: string
        default: ""
      version_name:
        description: Override version name (default from version.gd)
        type: string
        default: ""
  workflow_call:
    inputs:
      version_code:
        description: Override build number (default run_number + 100)
        type: string
        default: ""
      version_name:
        description: Override version name (default from version.gd)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ios:
    # vars.IOS_RUNNER is a JSON value, e.g. "macos-15" or ["self-hosted","macOS"].
    runs-on: ${{ vars.IOS_RUNNER && fromJSON(vars.IOS_RUNNER) || 'macos-15' }}
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v7

      - name: Mask secrets and check they exist
        run: |
          missing=""
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            value="${!name}"
            if [ -z "$value" ]; then missing="$missing $name"; else echo "::add-mask::$value"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: |
            .tools
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('Makefile', 'tools/setup_env.sh') }}

      # setup_env.sh has a Darwin branch (universal macOS build of Godot).
      - name: Setup Godot (macOS)
        run: make setup

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: version
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          code="${INPUT_CODE:-$((GITHUB_RUN_NUMBER + 100))}"
          name="$INPUT_NAME"
          if [ -z "$name" ]; then
            name="$(sed -nE 's/^const VERSION: String = "([^"]+)".*/\1/p' game/src/core/version.gd | head -n1)"
          fi
          [ -n "$name" ] || { echo "::error::Cannot determine version name"; exit 1; }
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name ($code)"

      # Release flow: changelog text from release.yml, passed to fastlane via env.
      - name: Download changelog
        if: inputs.version_code != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: changelog-in

      - name: Inject secrets and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          bash tools/inject_secrets.sh ios
          bash tools/set_version.sh "$VERSION_NAME" "$VERSION_CODE"

      - name: Export Xcode project
        run: |
          mkdir -p export/ios
          .tools/godot --headless --path game --export-release "iOS" ../export/ios/game.xcodeproj
          test -d export/ios/game.xcodeproj

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and upload to TestFlight
        env:
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          export APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # Release notes for TestFlight (first matching file, if release.yml produced one).
          cl="$(ls changelog-in/*.txt 2>/dev/null | head -n1 || true)"
          if [ -n "$cl" ]; then CHANGELOG="$(cat "$cl")"; export CHANGELOG; fi
          bundle exec fastlane ios beta

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: export/ios/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
