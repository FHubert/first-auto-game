<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Vialo — nagroda dzienna</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;background:#14213D;color:#fff;font-family:'Nunito',system-ui,sans-serif;position:relative;overflow:hidden}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative;height:104px;border-radius:20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.d{font-size:13px;font-weight:800}
.amt{font-size:18px;font-weight:900}
.chk{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:12px;border:2px solid #1F3A6B;box-sizing:border-box;background:#2EC4B6;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.btn{border:none;font-family:inherit;font-weight:900;font-size:19px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
</style>
</helmet>
<div class="scr">
  <div style="position: absolute; left: 20px; right: 20px; top: 56px; display: flex; justify-content: space-between; opacity: 0.5">
    <div style="width: 96px; height: 40px; border-radius: 20px; background: #0E1A33"></div>
    <div style="width: 150px; height: 40px; border-radius: 20px; background: #0E1A33"></div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 330px; height: 76px; border-radius: 38px; background: #2EC4B6; opacity: 0.35"></div>
  <div style="position: absolute; left: 20px; right: 20px; top: 430px; height: 160px; border-radius: 26px; background: #1F3A6B; opacity: 0.5"></div>
  <div style="position: absolute; inset: 0; background: rgba(6,12,28,0.7)"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 120px; background: #1F3A6B; border-radius: 32px; padding: 28px 18px 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(251,133,0,0.18); color: #FFB561; font-weight: 900; font-size: 15px">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.5c1 4 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.2 1.1-3.8 2.2-4.8 0 2.1 1 3.2 2.1 3.2 0-4.2-1-6.3 1.2-9.4z" fill="#FB8500"></path></svg>Seria: 5. dzień z rzędu
    </div>
    <div style="font-size: 30px; font-weight: 900; text-align: center; line-height: 1.1">Nagroda dzienna</div>
    <div style="font-size: 15px; font-weight: 700; color: #A9B8D6; text-align: center; margin-top: -8px">Wracaj codziennie, nagrody rosną</div>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div class="tile" style="{{d.style}}">
          <span class="d" style="{{d.labelStyle}}">{{d.label}}</span>
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="{{d.coinStyle}}"><circle cx="12" cy="12" r="9.5" fill="#FFD166" stroke="#C99A2E" stroke-width="1.8"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#C99A2E" stroke-width="1.6"></circle></svg>
          <span class="amt" style="{{d.amtStyle}}">{{d.amount}}</span>
          <sc-if value="{{d.claimed}}" hint-placeholder-val="{{ false }}"><span class="chk"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 3.5" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></sc-if>
        </div>
      </sc-for>
    </div>

    <button class="btn" style="background: #2EC4B6; color: #0B2A3C; box-shadow: 0 6px 0 #1C8F85; margin-top: 6px">Odbierz 150</button>
    <button class="btn" style="background: #FFD166; color: #3D2A00; box-shadow: 0 6px 0 #C99A2E"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>Odbierz ×2 · 300</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const amounts = [50, 50, 100, 100, 150, 150, 300];
    const today = 4;
    const days = amounts.map((a, i) => {
      const claimed = i < today;
      const isToday = i === today;
      let style = 'background: #16294F';
      if (claimed) style = 'background: #132444';
      if (isToday) style = 'background: #2A4A82; border: 3px solid #FFD166; transform: translateY(-4px)';
      if (i === 6) style += '; grid-column: span 2';
      return {
        label: isToday ? 'Dziś' : 'Dzień ' + (i + 1),
        labelStyle: isToday ? 'color: #FFD166' : 'color: #A9B8D6',
        amount: a,
        amtStyle: isToday ? 'color: #FFD166' : (claimed ? 'color: #A9B8D6' : 'color: #FFFFFF'),
        coinStyle: i === 6 ? 'width: 40px; height: 40px' : (claimed ? 'opacity: 0.45' : ''),
        claimed: claimed,
        style: style
      };
    });
    return { days: days };
  }
}
</script>
</body>
</html>
