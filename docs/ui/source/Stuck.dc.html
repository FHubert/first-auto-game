<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Vialo — utknięcie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;background:#14213D;color:#fff;font-family:'Nunito',system-ui,sans-serif;position:relative;overflow:hidden}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tw{display:flex;flex-direction:column;align-items:center}
.rim{width:56px;height:8px;border-radius:4px;margin-bottom:-2px;background:rgba(202,210,224,.55)}
.tube{position:relative;width:46px;height:180px;box-sizing:border-box;border:3px solid rgba(202,210,224,.55);border-top:none;border-radius:0 0 23px 23px;background:rgba(202,210,224,.08);display:flex;flex-direction:column-reverse;padding:0 3px 3px;overflow:hidden}
.lay{height:41px;flex:none}
.lay:first-child{border-radius:0 0 18px 18px}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 14px;border-radius:18px;background:#16294F;border:none;color:#fff;font-family:inherit;text-align:left;width:100%;box-sizing:border-box;cursor:pointer}
.ric{width:44px;height:44px;border-radius:22px;background:#2A4A82;display:flex;align-items:center;justify-content:center;flex:none}
.rt{flex:1;display:flex;flex-direction:column;gap:1px}
.rt b{font-size:17px;font-weight:800}
.rt span{font-size:14px;font-weight:600;color:#A9B8D6}
.price{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;background:#FFD166;color:#3D2A00;font-weight:900;font-size:15px;box-shadow:0 3px 0 #C99A2E}
.free{height:36px;padding:0 12px;border-radius:18px;background:#2EC4B6;color:#0B2A3C;font-weight:900;font-size:15px;display:flex;align-items:center;box-shadow:0 3px 0 #1C8F85}
.ad{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;background:#fff;color:#14213D;font-weight:900;font-size:15px;box-shadow:0 3px 0 #9FB0CF}
</style>
</helmet>
<div class="scr">
  <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; gap: 44px; padding: 0 24px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <sc-for list="{{row1}}" as="t" hint-placeholder-count="4"><div class="tw"><div class="rim"></div><div class="tube"><sc-for list="{{t.layers}}" as="l" hint-placeholder-count="3"><div class="lay" style="{{l.style}}"></div></sc-for></div></div></sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <sc-for list="{{row2}}" as="t" hint-placeholder-count="4"><div class="tw"><div class="rim"></div><div class="tube"><sc-for list="{{t.layers}}" as="l" hint-placeholder-count="3"><div class="lay" style="{{l.style}}"></div></sc-for></div></div></sc-for>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(6,12,28,0.62)"></div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #1F3A6B; border-radius: 32px; padding: 24px 18px 22px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 26px; font-weight: 900">Utknąłeś</div>
        <div style="font-size: 16px; font-weight: 700; color: #A9B8D6">Brakuje Ci tylko 3 ruchów do celu</div>
      </div>
      <button aria-label="Zamknij" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #16294F; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <button class="row"><span class="ric"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></span><span class="rt"><b>Cofnij ruch</b><span>Zostały 2 darmowe</span></span><span class="free">Za darmo</span></button>
    <button class="row"><span class="ric"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v13a3 3 0 0 0 6 0V3"></path><path d="M5.5 3h9"></path><path d="M19 8v6M16 11h6"></path></svg></span><span class="rt"><b>Dodatkowa probówka</b><span>Pusta, do końca poziomu</span></span><span class="ad"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>Reklama</span></button>
    <button class="row"><span class="ric"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 8v4l2.5 2"></path></svg></span><span class="rt"><b>+3 cofnięcia</b><span>Dodaj ładunki cofania</span></span><span class="price"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#3D2A00" opacity="0.18"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#3D2A00" stroke-width="2"></circle></svg>20</span></button>
    <button class="row"><span class="ric"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 21.5h4"></path><path d="M12 2.5a6.8 6.8 0 0 0-4 12.3c.6.5 1 1.3 1 2.2h6c0-.9.4-1.7 1-2.2a6.8 6.8 0 0 0-4-12.3z"></path></svg></span><span class="rt"><b>Podpowiedź</b><span>Pokaże najlepszy ruch</span></span><span class="price"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#3D2A00" opacity="0.18"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#3D2A00" stroke-width="2"></circle></svg>25</span></button>

    <div style="display: flex; gap: 10px; margin-top: 6px">
      <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #16294F; color: #fff; font-family: inherit; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 5px 0 #0E1A33"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Od nowa</button>
      <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #16294F; color: #fff; font-family: inherit; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 5px 0 #0E1A33"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><path d="M5 5l9 7-9 7z"></path><path d="M18 5v14"></path></svg>Pomiń</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const liq = ['#E63946','#FB8500','#FFD166','#80ED99','#2A9D8F','#4CC9F0'];
    const board = [[0,4,0,2],[3,2,0,4],[2,5,1,3],[3,3,5,0],[4,5,2,3],[5,4,1,1],[1,1],[4,5]];
    const tubes = board.map((t) => ({ layers: t.map((c) => ({ style: 'background: ' + liq[c] })) }));
    return { row1: tubes.slice(0, 4), row2: tubes.slice(4) };
  }
}
</script>
</body>
</html>
